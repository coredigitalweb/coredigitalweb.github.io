    <!-- डायनामिक ब्लॉग लोड करने का जावास्क्रिप्ट लॉजिक -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 1. यूआरएल से 'id' निकालना (जैसे: blog-details.html?id=0)
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get("id");

        if (blogId !== null) {
          // 2. आपकी JSON फाइल से डेटा फेच करना
          fetch("blogs.json")
            .then((response) => response.json())
            .then((blogs) => {
              const currentBlog = blogs[blogId];

              if (currentBlog) {
                // 3. पेज के एलिमेंट्स को JSON डेटा से बदल देना
                document.getElementById("detail-title").innerText =
                  currentBlog.title;
                document.title = `${currentBlog.title} - AK Core Digital Web`;

                const imgElement = document.getElementById("detail-image");
                imgElement.src = currentBlog.image;
                imgElement.alt = currentBlog.title;
                imgElement.style.display = "block";

                // अगर आप JSON में "content" नाम से बड़ा आर्टिकल जोड़ेंगे तो वो यहाँ दिखेगा, नहीं तो description दिखेगा
                document.getElementById("detail-description").innerHTML =
                  currentBlog.content || currentBlog.description;
              } else {
                document.getElementById("detail-description").innerText =
                  "ब्लॉग आर्टिकल नहीं मिला।";
              }
            })
            .catch((error) => {
              console.error("Error fetching blog details:", error);
              document.getElementById("detail-description").innerText =
                "ब्लॉग लोड करने में कोई तकनीकी खराबी आई।";
            });
        } else {
          document.getElementById("detail-description").innerText =
            "कोई ब्लॉग आईडी निर्दिष्ट नहीं की गई है।";
        }
      });
    </script>
